<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="Video player with SRT subtitles support.">
  <meta author="Kedan">
  <title>Huh? - Video Player</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div id="container">
    <div id="controls">
      <div id="file-controls">
        <h2>Files</h2>
        <div class="file-control">
          <label class="file-button">
            <input type="file" id="videoFile" accept="video/mp4,video/x-matroska">
            MP4
          </label>
          <span id="videoName" class="filename">No file</span>
        </div>
        <div class="file-control">
          <label class="file-button">
            <input type="file" id="subtitleFile" accept=".srt">
            SRT
          </label>
          <span id="subtitleName" class="filename">No file</span>
        </div>
      </div> <!-- file-controls -->
    
      <div id="subtitle-controls">
        <h2>Settings</h2>
        <div class="subtitle-control">
          <label>Enable</label>
          <input type="checkbox" id="subEnabled" checked>
        </div>
        <div class="subtitle-control">
          <label>Size</label>
          <select id="subSize" class="styled-select">
            <option value="16px">16px</option>
            <option value="24px">24px</option>
            <option value="32px" selected>32px</option>
            <option value="48px">48px</option>
          </select>
        </div>
        <div class="subtitle-control">
          <label>Font</label>
          <select id="subFont" class="styled-select">
            <option value="monospace" selected>Monospace</option>
            <option value="sans-serif">Sans-Serif</option>
            <option value="serif">Serif</option>
          </select>
        </div>
        <div class="subtitle-control">
          <label>Color</label>
          <select id="subColor" class="styled-select">
            <option value="#ffffff" selected>White</option>
            <option value="#ffff00">Yellow</option>
          </select>
        </div>
        <div class="subtitle-control">
          <label>Shadow</label>
          <select id="subShadow" class="styled-select">
            <option value="none">None</option>
            <option value="solid">Solid</option>
            <option value="soft" selected>Soft</option>
            <option value="stroke">Stroke</option>
          </select>
        </div>
        <div class="subtitle-control">
          <label>Opacity</label>
          <select id="subOpacity" class="styled-select">
            <option value="0">0%</option>
            <option value="0.25">25%</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
          </select>
        </div>
      </div> <!-- subtitle-controls -->
    </div> <!-- controls -->

    <div id="video-area">
      <div id="video-wrapper">
        <video id="video" controls></video>
        <div id="custom-subs"></div>
      </div>
    </div>
  </div> <!-- container -->
</body>
</html>
